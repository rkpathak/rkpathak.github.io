title: Tech & Notes          # Replaces your username in the top header & bottom-left
author: Ramakant            # Replaces your username under the footer title (or use a pen name)
description: >-              # Replaces the default GitHub repo description on the bottom-right
  Short notes on code and life.

  # remote_theme: daattali/beautiful-jekyll
remote_theme: mmistakes/minimal-mistakes
minimal_mistakes_skin: "air"

plugins:
  - jekyll-remote-theme
  - jekyll-include-cache

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      toc: true
      toc_sticky: true

